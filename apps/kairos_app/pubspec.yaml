name: kairos_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  kairos_core:
    path: ../../packages/kairos_core
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/arcs/joseph-test/arc.json

# Chiffrement au repos : SQLCipher a la place de SQLite (sqlite3 >= 3.x).
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
